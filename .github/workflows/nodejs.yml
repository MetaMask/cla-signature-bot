name: build

on:
  push:
   branches:
    - '*'
   tags:
    - '*'
  pull_request_target:
   branches:
   - master

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Use Node.js 24
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24
    - name: Npm install
      run: npm ci
    - name: Npm build
      run: npm run build --if-present
