name: build

on:
  push:
   branches:
    - '*'
   tags:
    - '*'
  pull_request_target:
   branches:
   - master

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Use Node.js 24
      uses: actions/setup-node@v7
      with:
        node-version: 24
    - name: Npm install
      run: npm ci
    - name: Npm build
      run: npm run build --if-present
